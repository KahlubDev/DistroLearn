; PgBouncer in transaction mode, per ADR 0006.
;
; The mode is the whole point. Transaction mode hands a server connection to a client for
; the length of one transaction and returns it afterwards, which matches the lifetime of
; SET LOCAL: the tenant value is discarded at commit, so it cannot survive onto the next
; request. Session mode would hold a connection for the whole client session, and statement
; mode forbids the multi-statement transaction every tenant-scoped request needs.
;
; server_reset_query is deliberately left at its default (DISABLED in transaction mode).
; ADR 0006 names it as not being the safety net: it does not run here, so tenant scoping
; rests entirely on set_config(..., is_local => true) inside every transaction.

[databases]
distrolearn = host=postgres port=5432 dbname=distrolearn

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; transaction mode, stated explicitly rather than left to a default that could change.
pool_mode = transaction

; max_prepared_statements lets pgx use prepared statements under transaction pooling.
; ADR 0006 flags this as needing confirmation, and this setting is that confirmation.
max_prepared_statements = 200

; Local development sizing. Production tuning belongs to E6 capacity work.
max_client_conn = 200
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Fail fast rather than queueing forever when Postgres is unreachable.
server_connect_timeout = 5
query_wait_timeout = 10

; Local only. A production deployment terminates TLS here.
auth_type = scram-sha-256

; Written at startup by /entrypoint.sh from environment variables, so the credential never
; lands in the repository. /tmp is container-local and writable by the image's postgres user.
auth_file = /tmp/userlist.txt

; Separate from the app role, so the role the services authenticate as cannot reach SHOW
; CONFIG or SHUTDOWN. Local compose only.
admin_users = pgbouncer_admin

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1